<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>patty 的健康小本本 🍓</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: 乾淨清晰的標準繁體中文黑體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fff6f8;
            background-image: radial-gradient(#fbcfe8 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* 卡片容器質感 */
        .book-container {
            background-color: #ffffff;
            border: 2px solid #fbcfe8;
            box-shadow: 0 10px 30px -5px rgba(244, 114, 182, 0.15);
        }

        /* 輸入框焦點樣式 */
        input[type="date"]:focus,
        input[type="text"]:focus {
            border-color: #f472b6;
            outline: none;
        }
    </style>
</head>

<body class="text-slate-800 min-h-screen pb-12 pt-4 sm:pt-8">

    <!-- 主要容器 -->
    <div class="max-w-xl mx-auto px-4">

        <div class="book-container rounded-3xl p-6 sm:p-8 relative">

            <!-- 頁面頂部 Header -->
            <header class="border-b-2 border-dashed border-pink-100 pb-5 mb-6 flex justify-between items-center">
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-pink-400 block mb-1">HEALTH
                        JOURNAL</span>
                    <h1 class="text-2xl sm:text-3xl font-bold text-pink-950 tracking-tight flex items-center gap-2">
                        📖 patty 的健康小本本
                    </h1>
                    <p id="today-date-display" class="text-xs text-pink-600 mt-1 font-medium"></p>
                </div>
                <button id="back-btn"
                    class="hidden text-xs px-3 py-1.5 bg-pink-50 hover:bg-pink-100 text-pink-700 rounded-full transition font-medium border border-pink-200">
                    ← 返回
                </button>
            </header>

            <!-- 主內容區域 -->
            <main>

                <!-- 頁面 1：大類別主頁 -->
                <section id="view-home" class="space-y-5">
                    <div
                        class="bg-pink-50/80 border border-pink-200/80 rounded-2xl p-4 text-pink-900 text-xs sm:text-sm flex items-center gap-2">
                        <span>🍓</span>
                        <span>點擊下方類別卡片，查看或新增看診紀錄。</span>
                    </div>

                    <div id="categories-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- JS 動態生成 5 個分類卡片 -->
                    </div>
                </section>

                <!-- 頁面 2：子科別/項目列表頁 -->
                <section id="view-category" class="hidden space-y-5">
                    <div class="flex items-center justify-between bg-pink-50/50 p-4 rounded-2xl border border-pink-100">
                        <div class="flex items-center gap-2.5">
                            <span id="cat-icon-display" class="text-2xl"></span>
                            <h2 id="cat-title-display" class="text-lg font-bold text-pink-950"></h2>
                        </div>
                        <button onclick="editCategoryName()"
                            class="text-xs text-pink-600 hover:text-pink-800 underline font-medium">
                            ✏️ 重新命名
                        </button>
                    </div>

                    <div class="flex justify-between items-center pt-2">
                        <h3 class="text-xs font-bold text-pink-400 tracking-wider uppercase">所有細項 / 科別</h3>
                        <button onclick="addNewSubcategory()"
                            class="text-xs bg-pink-600 hover:bg-pink-700 text-white font-medium px-3.5 py-1.5 rounded-full shadow-sm transition">
                            + 新增項目
                        </button>
                    </div>

                    <div id="subcategories-list" class="space-y-3">
                        <!-- JS 動態生成子項目 -->
                    </div>
                </section>

                <!-- 頁面 3：詳細看診紀錄頁面 -->
                <section id="view-records" class="hidden space-y-6">
                    <div class="bg-white p-5 rounded-2xl border border-pink-100 space-y-4">
                        <h2 id="subcat-title-display" class="text-base font-bold text-slate-800"></h2>

                        <!-- 上一次紀錄重點卡片 -->
                        <div
                            class="bg-pink-50 border border-pink-200 rounded-2xl p-4 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-pink-700 font-bold uppercase tracking-wider block mb-0.5">🗓️
                                    上一次紀錄日期</span>
                                <span id="last-visit-date" class="text-xl font-bold text-pink-950">尚無紀錄</span>
                            </div>
                            <span class="text-2xl">✨</span>
                        </div>
                    </div>

                    <!-- 新增紀錄表單 -->
                    <div class="bg-pink-50/40 p-5 rounded-2xl border border-pink-100 space-y-3">
                        <h3 class="text-xs font-bold text-slate-600 uppercase tracking-wider">➕ 新增看診紀錄</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">看診日期</label>
                                <input type="date" id="input-record-date"
                                    class="w-full bg-white border border-pink-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1 font-medium">備註 / 內容 (可不填)</label>
                                <input type="text" id="input-record-note" placeholder="例如：洗牙、打皮秒雷射、領藥..."
                                    class="w-full bg-white border border-pink-200 rounded-xl p-2.5 text-sm">
                            </div>
                            <button onclick="saveNewRecord()"
                                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-medium py-2.5 rounded-xl shadow-sm transition text-sm">
                                儲存紀錄
                            </button>
                        </div>
                    </div>

                    <!-- 歷史紀錄清單 -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-pink-400 tracking-wider uppercase px-1">📜 歷史紀錄</h3>
                        <div id="records-history-list" class="space-y-2.5">
                            <!-- JS 動態生成歷史紀錄 -->
                        </div>
                    </div>
                </section>

            </main>

        </div>
    </div>

    <script>
        // 實用導向的預設資料結構
        const initialData = {
            categories: [
                {
                    id: 'cat-1',
                    name: '醫院紀錄',
                    icon: '🏥',
                    subcategories: [
                        { id: 'sub-101', name: '眼科', records: [{ date: '2026-03-15', note: '視力檢查與開眼藥水' }] },
                        { id: 'sub-102', name: '牙科', records: [{ date: '2026-07-20', note: '定期洗牙' }] }
                    ]
                },
                {
                    id: 'cat-2',
                    name: '醫美紀錄',
                    icon: '✨',
                    subcategories: [
                        { id: 'sub-201', name: '皮秒雷射', records: [{ date: '2026-02-10', note: '全臉保養雷射' }] }
                    ]
                },
                { id: 'cat-3', name: '用藥紀錄', icon: '💊', subcategories: [] },
                { id: 'cat-4', name: '自訂項目 1', icon: '🩺', subcategories: [] },
                { id: 'cat-5', name: '自訂項目 2', icon: '📝', subcategories: [] }
            ]
        };

        // 狀態管理
        let appData = loadData();
        let currentCatId = null;
        let currentSubcatId = null;

        document.addEventListener('DOMContentLoaded', () => {
            displayTodayDate();
            renderHome();

            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('input-record-date').value = todayStr;

            document.getElementById('back-btn').addEventListener('click', handleBack);
        });

        function displayTodayDate() {
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('today-date-display').innerText = '今天是 ' + now.toLocaleDateString('zh-TW', options);
        }

        function loadData() {
            const saved = localStorage.getItem('patty_health_journal_clean');
            return saved ? JSON.parse(saved) : initialData;
        }

        function saveData() {
            localStorage.setItem('patty_health_journal_clean', JSON.stringify(appData));
        }

        function switchView(viewName) {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-category').classList.add('hidden');
            document.getElementById('view-records').classList.add('hidden');

            const backBtn = document.getElementById('back-btn');

            if (viewName === 'home') {
                document.getElementById('view-home').classList.remove('hidden');
                backBtn.classList.add('hidden');
                currentCatId = null;
                currentSubcatId = null;
            } else if (viewName === 'category') {
                document.getElementById('view-category').classList.remove('hidden');
                backBtn.classList.remove('hidden');
                currentSubcatId = null;
            } else if (viewName === 'records') {
                document.getElementById('view-records').classList.remove('hidden');
                backBtn.classList.remove('hidden');
            }
        }

        function handleBack() {
            if (currentSubcatId) {
                openCategory(currentCatId);
            } else {
                switchView('home');
            }
        }

        // 畫面 1: 主頁
        function renderHome() {
            const grid = document.getElementById('categories-grid');
            grid.innerHTML = '';

            appData.categories.forEach(cat => {
                const totalItems = cat.subcategories.length;
                const card = document.createElement('div');
                card.className = 'bg-white hover:bg-pink-50/50 rounded-2xl p-5 border border-pink-100 shadow-sm transition cursor-pointer flex flex-col justify-between h-36 group';
                card.onclick = () => openCategory(cat.id);

                card.innerHTML = `
          <div class="flex justify-between items-start">
            <span class="text-3xl">${cat.icon}</span>
            <span class="text-xs bg-pink-50 group-hover:bg-pink-100 text-pink-700 font-medium px-2.5 py-1 rounded-full transition">
              ${totalItems} 個項目
            </span>
          </div>
          <div>
            <h3 class="font-bold text-slate-800 text-base group-hover:text-pink-600 transition">${cat.name}</h3>
            <p class="text-xs text-slate-400 mt-0.5">點擊查看與編輯紀錄</p>
          </div>
        `;
                grid.appendChild(card);
            });

            switchView('home');
        }

        // 畫面 2: 大類別內項目
        function openCategory(catId) {
            currentCatId = catId;
            const cat = appData.categories.find(c => c.id === catId);
            if (!cat) return;

            document.getElementById('cat-title-display').innerText = cat.name;
            document.getElementById('cat-icon-display').innerText = cat.icon;

            const list = document.getElementById('subcategories-list');
            list.innerHTML = '';

            if (cat.subcategories.length === 0) {
                list.innerHTML = `
          <div class="text-center py-10 text-slate-400 text-xs bg-white rounded-2xl border border-dashed border-pink-200">
            目前還沒有項目，點擊右上角「+ 新增項目」吧！
          </div>
        `;
            } else {
                cat.subcategories.forEach(sub => {
                    const lastRecord = sub.records && sub.records.length > 0 ? sub.records[0].date : '尚無紀錄';

                    const item = document.createElement('div');
                    item.className = 'bg-white p-4 rounded-xl border border-pink-100 flex items-center justify-between hover:border-pink-300 transition cursor-pointer shadow-sm';
                    item.onclick = () => openSubcategoryRecords(sub.id);

                    item.innerHTML = `
            <div class="space-y-1">
              <h4 class="font-bold text-slate-800 text-sm">${sub.name}</h4>
              <div class="text-xs text-slate-500">
                上次看診：<span class="font-semibold ${lastRecord === '尚無紀錄' ? 'text-slate-400' : 'text-pink-600'}">${lastRecord}</span>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg font-medium">查看</span>
              <button onclick="event.stopPropagation(); deleteSubcategory('${sub.id}')" class="text-xs text-slate-300 hover:text-red-500 p-1">🗑️</button>
            </div>
          `;
                    list.appendChild(item);
                });
            }

            switchView('category');
        }

        function editCategoryName() {
            const cat = appData.categories.find(c => c.id === currentCatId);
            if (!cat) return;

            const newName = prompt('請輸入新的類別名稱：', cat.name);
            if (newName && newName.trim() !== '') {
                cat.name = newName.trim();
                saveData();
                openCategory(currentCatId);
            }
        }

        function addNewSubcategory() {
            const cat = appData.categories.find(c => c.id === currentCatId);
            if (!cat) return;

            const name = prompt('請輸入新項目名稱 (例如：眼科、皮膚科、皮秒雷射)：');
            if (name && name.trim() !== '') {
                const newSub = {
                    id: 'sub-' + Date.now(),
                    name: name.trim(),
                    records: []
                };
                cat.subcategories.push(newSub);
                saveData();
                openCategory(currentCatId);
            }
        }

        function deleteSubcategory(subId) {
            if (!confirm('確定要刪除這個項目嗎？相關紀錄也會一併被移除喔！')) return;

            const cat = appData.categories.find(c => c.id === currentCatId);
            if (cat) {
                cat.subcategories = cat.subcategories.filter(s => s.id !== subId);
                saveData();
                openCategory(currentCatId);
            }
        }

        // 畫面 3: 查看與紀錄日期
        function openSubcategoryRecords(subId) {
            currentSubcatId = subId;
            const cat = appData.categories.find(c => c.id === currentCatId);
            const sub = cat ? cat.subcategories.find(s => s.id === subId) : null;
            if (!sub) return;

            document.getElementById('subcat-title-display').innerText = `${cat.name} ▸ ${sub.name}`;

            // 最新日期排最前
            sub.records.sort((a, b) => new Date(b.date) - new Date(a.date));

            const lastDate = sub.records.length > 0 ? sub.records[0].date : '尚無紀錄';
            document.getElementById('last-visit-date').innerText = lastDate;

            const historyList = document.getElementById('records-history-list');
            historyList.innerHTML = '';

            if (sub.records.length === 0) {
                historyList.innerHTML = `
          <div class="text-center py-6 text-slate-400 text-xs bg-white rounded-xl border border-pink-100">
            還沒有紀錄，在上方輸入日期並點擊儲存吧！
          </div>
        `;
            } else {
                sub.records.forEach((rec, idx) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-3.5 rounded-xl border border-pink-100 flex justify-between items-center text-sm shadow-sm';

                    card.innerHTML = `
            <div>
              <div class="font-bold text-slate-800">${rec.date} ${idx === 0 ? '<span class="text-[10px] bg-pink-100 text-pink-800 px-1.5 py-0.5 rounded ml-1 font-normal">最新紀錄</span>' : ''}</div>
              ${rec.note ? `<div class="text-xs text-slate-500 mt-0.5">${rec.note}</div>` : ''}
            </div>
            <button onclick="deleteRecord(${idx})" class="text-xs text-slate-300 hover:text-red-500 p-1">🗑️</button>
          `;
                    historyList.appendChild(card);
                });
            }

            switchView('records');
        }

        function saveNewRecord() {
            const dateInput = document.getElementById('input-record-date').value;
            const noteInput = document.getElementById('input-record-note').value;

            if (!dateInput) {
                alert('請選擇看診日期！');
                return;
            }

            const cat = appData.categories.find(c => c.id === currentCatId);
            const sub = cat ? cat.subcategories.find(s => s.id === currentSubcatId) : null;

            if (sub) {
                sub.records.push({
                    date: dateInput,
                    note: noteInput.trim()
                });

                saveData();
                document.getElementById('input-record-note').value = '';
                openSubcategoryRecords(currentSubcatId);
            }
        }

        function deleteRecord(index) {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;

            const cat = appData.categories.find(c => c.id === currentCatId);
            const sub = cat ? cat.subcategories.find(s => s.id === currentSubcatId) : null;

            if (sub) {
                sub.records.splice(index, 1);
                saveData();
                openSubcategoryRecords(currentSubcatId);
            }
        }
    </script>
</body>

</html>
